<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Collaborative Text · WebApp Case Studies</title>
	<link rel="stylesheet" href="style.css">
	<style>
		body {
			margin: 0;
			padding: 1.5rem;
			background: #f1f5f9;
			color: #0f172a;
			font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
		}
		#container {
			gap: 1.5rem;
		}
		#peers {
			display: flex;
			flex-direction: column;
			gap: 1rem;
			margin: 1rem 0;
		}
		.my-border {
			min-height: 12rem;
			padding: 0.75rem 0.9rem;
			background: #fff;
			border: 1px solid #cbd5e1;
			border-radius: 10px;
		}
		.my-border .ProseMirror {
			min-height: 10.5rem;
			outline: none;
			white-space: pre-wrap;
			overflow-wrap: anywhere;
			font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
			font-size: 0.95rem;
			line-height: 1.6;
		}
		button {
			padding: 0.45rem 0.8rem;
			border: 1px solid #cbd5e1;
			border-radius: 8px;
			background: #f8fafc;
			color: #0f172a;
			font: inherit;
			cursor: pointer;
		}
		button:hover {
			background: #eef2ff;
			border-color: #a5b4fc;
		}
	</style>
</head>

<body>
	<section id="app">
		<noscript>
			<div style="padding:2em;text-align:center;font-size:2em">
				Please enable JavaScript!
			</div>
		</noscript>
	</section>

	<script type="module">
		import { initApp } from "./main.js";
		initApp("text-rdt");
	</script>
</body>

</html>
