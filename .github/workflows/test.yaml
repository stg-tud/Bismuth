name: test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "checkout reference (sha/branch)"
        required: false
        type: string

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macOS-15, ubuntu-24.04, windows-2025, ubuntu-24.04-arm]
        java-version: [21]

    env:
      JAVA_OPTS: -Xmx4g

    steps:
      - uses: actions/checkout@v7

      - uses: coursier/cache-action@v7

      - uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "zulu"

      - uses: sbt/setup-sbt@v1

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: install npm dependencies
        run: npm install

      - name: test
        run: sbt "test"
