rules = [
	ExplicitResultTypes,
	OrganizeImports,
	RedundantSyntax,
]

OrganizeImports.preset = INTELLIJ_2020_3
OrganizeImports.coalesceToWildcardImportThreshold = null
OrganizeImports.targetDialect = Scala3
OrganizeImports.expandRelative = true
// need to disable, otherwise we get errors because of incompatible compiler flags
OrganizeImports.removeUnused = false
// workaround for newer scala versions
ExplicitResultTypes.fetchScala3CompilerArtifactsOnVersionMismatch = true
